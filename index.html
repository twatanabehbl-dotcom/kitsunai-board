<style>
:root{--b:#2F4F6F;--a:#2F6FB0}*{box-sizing:border-box}body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;background:#F2F4F7;color:#1f2933}
header{background:var(--b);color:#fff;padding:14px 16px 10px}header h1{margin:0;font-size:18px;letter-spacing:.02em}header small{opacity:.8;font-size:11px}header p.muted{color:#cfd8e3;font-size:11px;margin:4px 0 0}
.tabs{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e7eb;display:flex;overflow-x:auto;padding:6px 8px;gap:6px}.tab{flex:0 0 auto;border:1px solid #d8dee5;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;color:#334;cursor:pointer}.tab.on{background:var(--a);color:#fff;border-color:var(--a)}.sep{flex:0 0 1px;background:#d8dee5;margin:0 6px}a.tab.month{text-decoration:none;background:#F6F8FA}a.tab.month.on{background:#2F4F6F;color:#fff;border-color:#2F4F6F}
.wrap{padding:12px 18px;max-width:1500px;margin:0 auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}tr.sum td{font-weight:700;background:#F6F8FA}.panel{display:none}.panel.on{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}h2{margin:0 0 10px;font-size:18px}h2 small{font-weight:400;color:#8a94a0;font-size:12px;margin-left:8px}h3{margin:0 0 8px;font-size:14px;color:var(--b)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}@media(min-width:1200px){.kpis{grid-template-columns:repeat(8,1fr)}}
.kpi{background:#F6F8FA;border-radius:10px;padding:10px 12px;min-height:74px}.kpi b{display:block;font-size:11px;color:#6b7683;font-weight:600}.kpi span{display:block;font-size:22px;font-weight:700;margin:3px 0 2px;font-variant-numeric:tabular-nums;line-height:1.15}.kpi small{color:#6b7683;font-size:11px}.kpi span .s{font-size:14px;font-weight:600;line-height:1.3}.kpi small span{display:inline;font-size:11px;font-weight:400;margin:0;line-height:1.5}
em{font-style:normal;font-weight:700}.ok{color:#1E8E3E}.ng{color:#C62828}.hot{color:#C62828;font-weight:700}
.chart{width:100%;height:170px;display:block}.legend{font-weight:400;font-size:11px;color:#6b7683;margin-left:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}

.heat th{font-size:11px;padding:3px 4px;text-align:center}.heat td.hm{padding:5px 4px;text-align:center;font-size:12px;min-width:34px}.muted{color:#8a94a0;font-size:12px}.read{background:#FFF8E6;border-left:4px solid #E0A030;padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.6;margin:10px 0 0}.read b{color:#8a5a00;margin-right:6px}details{margin-top:6px}summary{cursor:pointer;color:var(--a);font-size:13px;font-weight:600}
#lock{position:fixed;inset:0;background:#F2F4F7;display:flex;align-items:center;justify-content:center;z-index:99}#lock form{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.1);text-align:center}#lock input{font-size:22px;padding:8px;width:140px;text-align:center;letter-spacing:.2em;border:1px solid #ccd;border-radius:8px}#lock button{margin-top:10px;font-size:15px;padding:8px 18px;border:0;border-radius:8px;background:var(--a);color:#fff}
.flash h2{font-size:20px}.flash table{font-size:15px}.flash th,.flash td{padding:9px 8px}.flash tr.sum td{font-size:16px}.flash td.gap{font-weight:700}.flash tr.old td{color:#8a94a0}.flash table.mt{font-size:13.5px}.flash table.mt th,.flash table.mt td{padding:6px 8px}.flash .read{font-size:14px;margin:0 0 10px}
@media(max-width:600px){.wrap{padding:8px 6px}.card.flash{padding:12px 8px}.flash table{font-size:13.5px}.flash th,.flash td{padding:8px 3px}.flash tr.sum td{font-size:14.5px}.flash table:not(.mt) th:nth-child(n+5),.flash table:not(.mt) td:nth-child(n+5){display:none}.flash table.mt:not(.rv) th:nth-child(4),.flash table.mt:not(.rv) td:nth-child(4),.flash table.mt:not(.rv) th:nth-child(5),.flash table.mt:not(.rv) td:nth-child(5){display:none}.flash .read{font-size:13px}}
footer{color:#8a94a0;font-size:11px;padding:6px 12px 30px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),unb=a=>btoa(String.fromCharCode(...a)),hex=s=>Uint8Array.from(s.match(/../g),h=>parseInt(h,16));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
async function derive(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(p)),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(SALT),iterations:IT,hash:'SHA-256'},km,512))}
async function dec(k,X){try{const iv=b64(X.iv),ct=b64(X.ct),m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);
const mk=await crypto.subtle.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);if(!await crypto.subtle.verify('HMAC',mk,b64(X.mac),m))return null;
const ek=await crypto.subtle.importKey('raw',k.slice(0,32),{name:'AES-CBC'},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ek,ct))}catch(e){return null}}
async function unseal(k){const t=await dec(k,B);if(t===null)return false;document.getElementById('app').innerHTML=t;document.getElementById('lock').remove();bind();admin();return true}
async function admin(){const s=localStorage.getItem('kba');if(!s)return;const t=await dec(b64(s),A);if(t===null)return;const N=JSON.parse(t);document.querySelectorAll('.adm').forEach(e=>{e.outerHTML=N[+e.dataset.i]||''})}
function bind(){document.querySelectorAll('button.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('button.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.p===t.dataset.t));window.scrollTo(0,0)})}
async function tryPass(p){const k=await derive(p);if(await unseal(k)){try{localStorage.setItem('kb2',unb(k))}catch(e){}return true}return false}
async function chk(e){e.preventDefault();const i=document.getElementById('pin');if(!await tryPass(i.value)){i.value='';document.getElementById('msg').textContent='合言葉が違います';document.getElementById('msg').className='ng'}return false}
function showForm(){const f=document.querySelector('#lock form');if(f){f.style.visibility='visible';document.getElementById('pin').focus()}}
(async()=>{try{const q=new URLSearchParams(location.hash.slice(1)),hk=q.get('k'),ha=q.get('a');
if(hk||ha)history.replaceState(null,'',location.pathname+location.search);
let ok=false;if(hk)ok=await tryPass(hk);
if(!ok){const s=localStorage.getItem('kb2');ok=!!(s&&await unseal(b64(s)))}
if(ha){const k=await derive(ha);if(await dec(k,A)!==null){localStorage.setItem('kba',unb(k));if(ok)await admin()}}
if(ok)return}catch(e){}
showForm()})();setTimeout(showForm,6000);
