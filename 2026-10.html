async function derive(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(p)),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(SALT),iterations:IT,hash:'SHA-256'},km,512))}
async function dec(k,X){try{const iv=b64(X.iv),ct=b64(X.ct),m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);
const mk=await crypto.subtle.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);if(!await crypto.subtle.verify('HMAC',mk,b64(X.mac),m))return null;
const ek=await crypto.subtle.importKey('raw',k.slice(0,32),{name:'AES-CBC'},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ek,ct))}catch(e){return null}}
async function unseal(k){const t=await dec(k,B);if(t===null)return false;document.getElementById('app').innerHTML=t;document.getElementById('lock').remove();bind();await admin();tasks();if(HT){const b=[...document.querySelectorAll('button.tab')].find(x=>x.dataset.t===HT);if(b)b.click()}return true}
async function admin(){const s=localStorage.getItem('kba');if(!s)return;const t=await dec(b64(s),A);if(t===null)return;const N=JSON.parse(t);document.querySelectorAll('.adm').forEach(e=>{e.outerHTML=N[+e.dataset.i]||''})}
function csvdl(name,rows){const t=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csvrows(id){const t=document.getElementById(id);return t?[...t.rows].map(tr=>[...tr.cells].map(td=>td.innerText.replace(/\s+/g,' ').trim())):[]}
function rvrows(){const J=JSON.parse(document.getElementById('rvjson').textContent);const out=[['店','媒体','日付','累計','交換数（前回比）','日数','評価']];const LAB={Google:'GBP',TA:'TA'};for(const st in J){for(const m in J[st]){const l=J[st][m];l.forEach((r,i)=>{const p=i?l[i-1]:null;const dd=p?Math.round((new Date(r.d)-new Date(p.d))/86400000):'';out.push([st,LAB[m]||m,r.d,r.c,p?r.c-p.c:'',dd,r.r||''])})}}return out}
function bind(){document.querySelectorAll('button.csvb').forEach(b=>b.onclick=()=>{if(b.id==='rvcsv')csvdl(b.dataset.n,rvrows());else csvdl(b.dataset.n,csvrows(b.dataset.t))});document.querySelectorAll('table').forEach(t=>{const h=t.rows[0];const r=[...t.rows].find(x=>x.querySelector('td'));if(!h||!r||!h.querySelector('th'))return;[...r.cells].forEach((c,i)=>{if(c.classList.contains('n')&&h.cells[i])h.cells[i].classList.add('n')})});document.querySelectorAll('a.tab.month').forEach(a=>a.onclick=e=>{const on=document.querySelector('button.tab.on');if(on&&on.dataset.t!=='all'){e.preventDefault();location.href=a.getAttribute('href').split('#')[0]+'#t='+encodeURIComponent(on.dataset.t)}});document.querySelectorAll('button.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('button.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.p===t.dataset.t));window.scrollTo(0,0)});document.querySelectorAll('button.fday').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.fday').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.fblk').forEach(p=>p.classList.toggle('on',p.dataset.d===b.dataset.d))});document.querySelectorAll('button.sday').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.sday').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.sblk').forEach(p=>p.classList.toggle('on',p.dataset.d===b.dataset.d))})}

let TD=[],TC=null;const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tadm(){const e=document.getElementById('tadm');return e&&e.dataset.k||''}
function today(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10)}
function isOver(t){return !t.done&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&t.due<today()}
function dueLab(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)?(+d.slice(5,7))+'/'+(+d.slice(8,10)):d}
async function tasks(){const a=document.getElementById('task_all');if(!a)return;TC={u:a.dataset.u,k:a.dataset.k,st:JSON.parse(a.dataset.st)};
try{const r=await(await fetch(TC.u+'?action=tasks&key='+encodeURIComponent(TC.k))).json();if(!r.ok)throw 0;TD=r.tasks;trender()}catch(e){document.querySelectorAll('.tmsg').forEach(m=>m.textContent='タスクを読み込めませんでした')}}
function li(t,showStore){const ad=tadm();return '<li data-id="'+esc(t.id)+'" class="'+(t.done?'done ':'')+(isOver(t)?'over':'')+'"><input type="checkbox" '+(t.done?'checked':'')+'><span class="tx">'+esc(t.text)+'<span class="mt">'+(showStore?esc(TC.st[t.store]||t.store)+'　':'')+(t.who?'担当 '+esc(t.who)+'　':'')+(t.due?'<span class="due">期限 '+esc(dueLab(t.due))+'</span>':'')+(t.done&&t.done_at?'　済 '+esc(t.done_at):'')+'</span></span>'+(ad?'<button class="del">消す</button>':'')+'</li>'}
function sortT(l){return l.slice().sort((a,b)=>(a.done-b.done)||((a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:0))}
function trender(){const a=document.getElementById('task_all');const keys=Object.keys(TC.st).concat(['共通']);
let rows='';for(const k of keys){const l=TD.filter(t=>t.store===k);if(!l.length)continue;const op=l.filter(t=>!t.done).length,ov=l.filter(isOver).length;rows+='<tr><td>'+esc(TC.st[k]||k)+'</td><td class="n">'+op+'</td><td class="n">'+(l.length-op)+'</td><td class="n">'+(ov?'<b>'+ov+'</b>':'0')+'</td></tr>'}
const who={};TD.filter(t=>!t.done).forEach(t=>{(t.who||'未定').split(/[・、,]/).forEach(w=>{w=w.trim();if(w)who[w]=(who[w]||0)+1})});
let h='<h2>今週のタスク<small>チェックで済み（取り消し線）</small></h2>'+(rows?'<table class="tsum"><tr><th>店</th><th class="n">残り</th><th class="n">済み</th><th class="n">期限切れ</th></tr>'+rows+'</table>':'<p class="muted">タスクはまだありません</p>');
if(Object.keys(who).length)h+='<p style="font-size:13px;margin:10px 0 0">担当別の残り：'+Object.entries(who).sort((a,b)=>b[1]-a[1]).map(([w,n])=>esc(w)+' '+n).join('　')+'</p>';
const com=TD.filter(t=>t.store==='共通');if(com.length)h+='<div class="tgrp">全店共通</div><ul class="tl">'+sortT(com).map(t=>li(t,false)).join('')+'</ul>';
h+='<details><summary>全店のタスクを開く</summary>'+keys.filter(k=>k!=='共通').map(k=>{const l=TD.filter(t=>t.store===k);return l.length?'<div class="tgrp">'+esc(TC.st[k])+'</div><ul class="tl">'+sortT(l).map(t=>li(t,false)).join('')+'</ul>':''}).join('')+'</details>';
if(tadm())h+='<form class="tadd on" id="taddf"><select name="store">'+keys.map(k=>'<option value="'+esc(k)+'">'+esc(TC.st[k]||k)+'</option>').join('')+'</select><input name="text" placeholder="やること" required><input name="who" placeholder="担当" style="width:90px"><input name="due" type="date"><button>追加</button></form>';
a.innerHTML=h;
document.querySelectorAll('.tbox').forEach(b=>{const l=TD.filter(t=>t.store===b.dataset.s);b.innerHTML='<h3>この店のタスク<small class="legend">チェックで済み</small></h3>'+(l.length?'<ul class="tl">'+sortT(l).map(t=>li(t,false)).join('')+'</ul>':'<p class="muted">タスクはありません</p>')});
document.querySelectorAll('.tl li').forEach(e=>{const id=e.dataset.id;e.querySelector('input').onchange=ev=>tdone(id,ev.target.checked);const d=e.querySelector('.del');if(d)d.onclick=()=>tdel(id)});
const f=document.getElementById('taddf');if(f)f.onsubmit=tadd}
async function tpost(o){const r=await fetch(TC.u,{method:'POST',body:JSON.stringify(o)});return r.json()}
async function tdone(id,done){const t=TD.find(x=>x.id===id);if(!t)return;t.done=done;t.done_at=done?'いま':'';trender();try{const r=await tpost({action:'task_done',key:TC.k,id,done});if(!r.ok)throw 0}catch(e){t.done=!done;trender();alert('保存できませんでした。もう一度押してください')}}
async function tdel(id){const t=TD.find(x=>x.id===id);if(!t||!confirm('画面から消しますか？\n'+t.text))return;try{const r=await tpost({action:'task_del',admin:tadm(),id});if(!r.ok)throw 0;TD=TD.filter(x=>x.id!==id);trender()}catch(e){alert('消せませんでした')}}
async function tadd(e){e.preventDefault();const f=e.target,o={store:f.store.value,text:f.text.value.trim(),who:f.who.value.trim(),due:f.due.value};if(!o.text)return false;try{const r=await tpost(Object.assign({action:'task_add',admin:tadm(),src:'ボード'},o));if(!r.ok)throw 0;TD.push(Object.assign({id:r.ids[0],done:false,done_at:''},o));trender()}catch(e){alert('追加できませんでした')}return false}
async function tryPass(p){const k=await derive(p);if(await unseal(k)){try{localStorage.setItem('kb2',unb(k))}catch(e){}return true}return false}
async function chk(e){e.preventDefault();const i=document.getElementById('pin');if(!await tryPass(i.value)){i.value='';document.getElementById('msg').textContent='合言葉が違います';document.getElementById('msg').className='ng'}return false}
function showForm(){const f=document.querySelector('#lock form');if(f){f.style.visibility='visible';document.getElementById('pin').focus()}}
(async()=>{try{const q=new URLSearchParams(location.hash.slice(1)),hk=q.get('k'),ha=q.get('a');HT=q.get('t');
if(hk||ha||HT)history.replaceState(null,'',location.pathname+location.search);
let ok=false;if(hk)ok=await tryPass(hk);
if(!ok){const s=localStorage.getItem('kb2');ok=!!(s&&await unseal(b64(s)))}
if(ha){const k=await derive(ha);if(await dec(k,A)!==null){localStorage.setItem('kba',unb(k));if(ok){await admin();if(TC&&TD)trender()}}}
if(ok)return}catch(e){}
showForm()})();setTimeout(showForm,6000);
</script></body></html>
