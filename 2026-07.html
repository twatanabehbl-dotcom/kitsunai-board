const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),unb=a=>btoa(String.fromCharCode(...a)),hex=s=>Uint8Array.from(s.match(/../g),h=>parseInt(h,16));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');let HT=null;   // 月タブで移動してきたときに開く店タブ（#t=店キー）
async function derive(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(p)),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(SALT),iterations:IT,hash:'SHA-256'},km,512))}
async function dec(k,X){try{const iv=b64(X.iv),ct=b64(X.ct),m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);
const mk=await crypto.subtle.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);if(!await crypto.subtle.verify('HMAC',mk,b64(X.mac),m))return null;
const ek=await crypto.subtle.importKey('raw',k.slice(0,32),{name:'AES-CBC'},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ek,ct))}catch(e){return null}}
async function unseal(k){const t=await dec(k,B);if(t===null)return false;document.getElementById('app').innerHTML=t;document.getElementById('lock').remove();bind();admin();if(HT){const b=[...document.querySelectorAll('button.tab')].find(x=>x.dataset.t===HT);if(b)b.click()}return true}
async function admin(){const s=localStorage.getItem('kba');if(!s)return;const t=await dec(b64(s),A);if(t===null)return;const N=JSON.parse(t);document.querySelectorAll('.adm').forEach(e=>{e.outerHTML=N[+e.dataset.i]||''})}
function csvdl(name,rows){const t=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csvrows(id){const t=document.getElementById(id);return t?[...t.rows].map(tr=>[...tr.cells].map(td=>td.innerText.replace(/\s+/g,' ').trim())):[]}
function rvrows(){const J=JSON.parse(document.getElementById('rvjson').textContent);const out=[['店','媒体','日付','累計','交換数（前回比）','日数','評価']];const LAB={Google:'GBP',TA:'TA'};for(const st in J){for(const m in J[st]){const l=J[st][m];l.forEach((r,i)=>{const p=i?l[i-1]:null;const dd=p?Math.round((new Date(r.d)-new Date(p.d))/86400000):'';out.push([st,LAB[m]||m,r.d,r.c,p?r.c-p.c:'',dd,r.r||''])})}}return out}
function bind(){document.querySelectorAll('button.csvb').forEach(b=>b.onclick=()=>{if(b.id==='rvcsv')csvdl(b.dataset.n,rvrows());else csvdl(b.dataset.n,csvrows(b.dataset.t))});document.querySelectorAll('table').forEach(t=>{const h=t.rows[0];const r=[...t.rows].find(x=>x.querySelector('td'));if(!h||!r||!h.querySelector('th'))return;[...r.cells].forEach((c,i)=>{if(c.classList.contains('n')&&h.cells[i])h.cells[i].classList.add('n')})});document.querySelectorAll('a.tab.month').forEach(a=>a.onclick=e=>{const on=document.querySelector('button.tab.on');if(on&&on.dataset.t!=='all'){e.preventDefault();location.href=a.getAttribute('href').split('#')[0]+'#t='+encodeURIComponent(on.dataset.t)}});document.querySelectorAll('button.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('button.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.dataset.p===t.dataset.t));window.scrollTo(0,0)});document.querySelectorAll('button.fday').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.fday').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.fblk').forEach(p=>p.classList.toggle('on',p.dataset.d===b.dataset.d))});document.querySelectorAll('button.sday').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.sday').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.sblk').forEach(p=>p.classList.toggle('on',p.dataset.d===b.dataset.d))})}
async function tryPass(p){const k=await derive(p);if(await unseal(k)){try{localStorage.setItem('kb2',unb(k))}catch(e){}return true}return false}
async function chk(e){e.preventDefault();const i=document.getElementById('pin');if(!await tryPass(i.value)){i.value='';document.getElementById('msg').textContent='合言葉が違います';document.getElementById('msg').className='ng'}return false}
function showForm(){const f=document.querySelector('#lock form');if(f){f.style.visibility='visible';document.getElementById('pin').focus()}}
(async()=>{try{const q=new URLSearchParams(location.hash.slice(1)),hk=q.get('k'),ha=q.get('a');HT=q.get('t');
if(hk||ha||HT)history.replaceState(null,'',location.pathname+location.search);
let ok=false;if(hk)ok=await tryPass(hk);
if(!ok){const s=localStorage.getItem('kb2');ok=!!(s&&await unseal(b64(s)))}
if(ha){const k=await derive(ha);if(await dec(k,A)!==null){localStorage.setItem('kba',unb(k));if(ok)await admin()}}
if(ok)return}catch(e){}
showForm()})();setTimeout(showForm,6000);
