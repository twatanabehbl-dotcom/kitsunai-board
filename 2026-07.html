function sortT(l){return l.slice().sort((a,b)=>(a.done-b.done)||((a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:0))}
function trender(){const a=document.getElementById('task_all');const keys=Object.keys(TC.st).concat(['共通']);
let rows='';for(const k of keys){const l=TD.filter(t=>t.store===k);if(!l.length)continue;const op=l.filter(t=>!t.done).length,ov=l.filter(isOver).length;rows+='<tr><td>'+esc(TC.st[k]||k)+'</td><td class="n">'+op+'</td><td class="n">'+(l.length-op)+'</td><td class="n">'+(ov?'<b>'+ov+'</b>':'0')+'</td></tr>'}
const who={};TD.filter(t=>!t.done).forEach(t=>{(t.who||'未定').split(/[・、,]/).forEach(w=>{w=w.trim();if(w)who[w]=(who[w]||0)+1})});
let h='<h2>今週のタスク<small>チェックで済み（取り消し線）</small></h2>'+(rows?'<table class="tsum"><tr><th>店</th><th class="n">残り</th><th class="n">済み</th><th class="n">期限切れ</th></tr>'+rows+'</table>':'<p class="muted">タスクはまだありません</p>');
if(Object.keys(who).length)h+='<p style="font-size:13px;margin:10px 0 0">担当別の残り：'+Object.entries(who).sort((a,b)=>b[1]-a[1]).map(([w,n])=>esc(w)+' '+n).join('　')+'</p>';
const com=TD.filter(t=>t.store==='共通');if(com.length)h+='<div class="tgrp">全店共通</div><ul class="tl">'+sortT(com).map(t=>li(t,false)).join('')+'</ul>';
h+='<details><summary>全店のタスクを開く</summary>'+keys.filter(k=>k!=='共通').map(k=>{const l=TD.filter(t=>t.store===k);return l.length?'<div class="tgrp">'+esc(TC.st[k])+'</div><ul class="tl">'+sortT(l).map(t=>li(t,false)).join('')+'</ul>':''}).join('')+'</details>';
if(tadm())h+='<form class="tadd on" id="taddf"><select name="store">'+keys.map(k=>'<option value="'+esc(k)+'">'+esc(TC.st[k]||k)+'</option>').join('')+'</select><input name="text" placeholder="やること" required><input name="who" placeholder="担当" style="width:90px"><input name="due" type="date"><button>追加</button></form>';
a.innerHTML=h;
document.querySelectorAll('.tbox').forEach(b=>{const l=TD.filter(t=>t.store===b.dataset.s);b.innerHTML='<h3>この店のタスク<small class="legend">チェックで済み</small></h3>'+(l.length?'<ul class="tl">'+sortT(l).map(t=>li(t,false)).join('')+'</ul>':'<p class="muted">タスクはありません</p>')});
document.querySelectorAll('.tl li').forEach(e=>{const id=e.dataset.id;e.querySelector('input').onchange=ev=>tdone(id,ev.target.checked);const d=e.querySelector('.del');if(d)d.onclick=()=>tdel(id)});
const f=document.getElementById('taddf');if(f)f.onsubmit=tadd}
async function tpost(o){const r=await fetch(TC.u,{method:'POST',body:JSON.stringify(o)});return r.json()}
async function tdone(id,done){const t=TD.find(x=>x.id===id);if(!t)return;t.done=done;t.done_at=done?'いま':'';trender();try{const r=await tpost({action:'task_done',key:TC.k,id,done});if(!r.ok)throw 0}catch(e){t.done=!done;trender();alert('保存できませんでした。もう一度押してください')}}
async function tdel(id){const t=TD.find(x=>x.id===id);if(!t||!confirm('画面から消しますか？\n'+t.text))return;try{const r=await tpost({action:'task_del',admin:tadm(),id});if(!r.ok)throw 0;TD=TD.filter(x=>x.id!==id);trender()}catch(e){alert('消せませんでした')}}
async function tadd(e){e.preventDefault();const f=e.target,o={store:f.store.value,text:f.text.value.trim(),who:f.who.value.trim(),due:f.due.value};if(!o.text)return false;try{const r=await tpost(Object.assign({action:'task_add',admin:tadm(),src:'ボード'},o));if(!r.ok)throw 0;TD.push(Object.assign({id:r.ids[0],done:false,done_at:''},o));trender()}catch(e){alert('追加できませんでした')}return false}
async function tryPass(p){const k=await derive(p);if(await unseal(k)){try{localStorage.setItem('kb2',unb(k))}catch(e){}return true}return false}
async function chk(e){e.preventDefault();const i=document.getElementById('pin');if(!await tryPass(i.value)){i.value='';document.getElementById('msg').textContent='合言葉が違います';document.getElementById('msg').className='ng'}return false}
function showForm(){const f=document.querySelector('#lock form');if(f){f.style.visibility='visible';document.getElementById('pin').focus()}}
(async()=>{try{const q=new URLSearchParams(location.hash.slice(1)),hk=q.get('k'),ha=q.get('a');HT=q.get('t');
if(hk||ha||HT)history.replaceState(null,'',location.pathname+location.search);
let ok=false;if(hk)ok=await tryPass(hk);
if(!ok){const s=localStorage.getItem('kb2');ok=!!(s&&await unseal(b64(s)))}
if(ha){const k=await derive(ha);if(await dec(k,A)!==null){localStorage.setItem('kba',unb(k));if(ok){await admin();if(TC&&TD)trender()}}}
if(ok)return}catch(e){}
showForm()})();setTimeout(showForm,6000);
</script></body></html>
