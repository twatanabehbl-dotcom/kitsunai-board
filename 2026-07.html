<style>
:root{--b:#2F4F6F;--a:#2F6FB0}*{box-sizing:border-box}body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;background:#F2F4F7;color:#1f2933}
header{background:var(--b);color:#fff;padding:14px 16px 10px}header h1{margin:0;font-size:18px;letter-spacing:.02em}header small{opacity:.8;font-size:11px}header p.muted{color:#cfd8e3;font-size:11px;margin:4px 0 0}
